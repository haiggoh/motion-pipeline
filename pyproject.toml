[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "motion_pipeline"
module-root = ""

[project]
name = "motion-pipeline"
version = "0.8.3"
description = "Reusable, publishable kinetic-typography render pipeline with a no-code project menu (CI colours + font + transcript + optional VO in, 10-bit masters out)"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "numpy>=1.26",
    "pillow>=10",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "pytest-xdist>=3", "opentimelineio==0.18.1", "otio-fcp-adapter==1.0.0", "fonttools>=4.50"]  # Task 15c: independent XML re-read in tests; xdist: rtc-ship's gate runs -n 12

[project.scripts]
motion-pipeline = "motion_pipeline.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: real render / venv install (minutes); the full gate runs them, the inner loop uses -m 'not slow'",
    "flaky: load-sensitive TUI/PTY/venv tests — run in their own low-parallelism shard (.rtc/pre-flight.sh), never in the parallel gate",
]

[tool.ruff.lint.per-file-ignores]
"motion_pipeline/tui/**" = ["BLE001"]
# boundary guards that deliberately catch Exception (probes must not crash; menu must not die):
# align.py (probe fallback), playbook.py (parse fallback), projects_list.py, render_cli.py (node probe),
# free_agents.py
"motion_pipeline/align.py" = ["BLE001"]
"motion_pipeline/playbook.py" = ["BLE001"]
"motion_pipeline/projects_list.py" = ["BLE001"]
"motion_pipeline/render_cli.py" = ["BLE001"]
"motion_pipeline/free_agents.py" = ["BLE001"]
# Test code is allowed the idioms the production rules forbid: fixtures are opened
# ad-hoc, subprocess probes deliberately ignore return codes, tuple unpacking is the
# house fixture style. Production code (motion_pipeline/, tools/) stays fully linted.
"tests/**" = ["SIM115", "PLW1510", "RUF059", "ASYNC230", "ASYNC221", "BLE001"]
