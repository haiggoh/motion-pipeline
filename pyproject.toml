[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "motion_pipeline"
module-root = ""

[project]
name = "motion-pipeline"
version = "0.1.2"
description = "Reusable, publishable kinetic-typography render pipeline with a no-code project menu (CI colours + font + transcript + optional VO in, 10-bit masters out)"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[project.scripts]
motion-pipeline = "motion_pipeline.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
